# =============================================================================
# Mesob Inventory Management System - Odoo Configuration
# =============================================================================
#
# Production configuration for Odoo 19
# DO NOT edit this file directly in production
# Override with environment variables or docker-compose.yml
#
# =============================================================================

[options]

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------

# Administrator password (used for database management operations)
# CRITICAL: Must be set via environment variable ODOO_MASTER_PASSWORD
admin_passwd = ${ODOO_MASTER_PASSWORD}

# Proxy mode (required when behind nginx reverse proxy)
proxy_mode = True

# Database filter (regex to restrict visible databases)
# Only show databases matching pattern for security
dbfilter = ${ODOO_DB_FILTER}

# List databases on login screen? (False = security, True = convenience)
list_db = False

# -----------------------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------------------------

# PostgreSQL connection parameters
db_host = ${POSTGRES_HOST}
db_port = ${POSTGRES_PORT}
db_user = ${POSTGRES_ODOO_USER}
db_password = ${POSTGRES_ODOO_PASSWORD}

# Database name (can be overridden at runtime)
db_name = ${ODOO_DB_NAME}

# Maximum number of connections to PostgreSQL
db_maxconn = 64

# Database template for new databases
db_template = template0

# -----------------------------------------------------------------------------
# Network Configuration
# -----------------------------------------------------------------------------

# HTTP interface to listen on
http_interface = 0.0.0.0
http_port = 8069

# Longpolling interface (for real-time features like messaging)
longpolling_port = 8072

# Maximum allowed HTTP request size (in bytes)
# 100MB for file uploads
limit_request = 104857600

# Maximum number of parameters in HTTP requests
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

# CPU time limit per request (seconds)
limit_time_cpu = 600

# Real time limit per request (seconds)
limit_time_real = 1200

# -----------------------------------------------------------------------------
# Worker Configuration
# -----------------------------------------------------------------------------

# Number of worker processes
# Recommended: (CPU cores * 2) + 1
# 0 = single-threaded mode (development only)
workers = ${ODOO_WORKERS}

# Maximum number of requests per worker before restart
# Prevents memory leaks from accumulating
max_cron_threads = ${ODOO_MAX_CRON_THREADS}

# Worker limits (per worker)
limit_time_cpu = ${ODOO_LIMIT_TIME_CPU}
limit_time_real = ${ODOO_LIMIT_TIME_REAL}
limit_memory_soft = ${ODOO_LIMIT_MEMORY_SOFT}
limit_memory_hard = ${ODOO_LIMIT_MEMORY_HARD}

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------

# Log level: debug, debug_rpc, debug_rpc_answer, debug_sql, info, warning, error, critical
# Use 'info' for production, 'debug' only for troubleshooting
log_level = ${LOG_LEVEL}

# Log file location
logfile = /var/log/odoo/odoo.log

# Log rotation (create new log file daily)
logrotate = True

# Log format
log_handler = :INFO
log_db = False
log_db_level = warning

# Detailed logging for specific modules (debugging)
# log_handler = odoo.addons.mesob_inventory_base:DEBUG

# -----------------------------------------------------------------------------
# Module Configuration
# -----------------------------------------------------------------------------

# Addons path (directories containing Odoo modules)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# Server-wide modules (loaded for all databases)
server_wide_modules = base,web

# Demo data (NEVER enable in production)
without_demo = all

# -----------------------------------------------------------------------------
# Session Configuration
# -----------------------------------------------------------------------------

# Session timeout (seconds) - 7 days
session_timeout = 604800

# -----------------------------------------------------------------------------
# File Storage Configuration
# -----------------------------------------------------------------------------

# Data directory (filestore for attachments)
data_dir = /var/lib/odoo

# -----------------------------------------------------------------------------
# Email Configuration
# -----------------------------------------------------------------------------

# SMTP server for outgoing emails
email_from = ${EMAIL_FROM}
smtp_server = ${SMTP_HOST}
smtp_port = ${SMTP_PORT}
smtp_ssl = ${SMTP_SECURITY}
smtp_user = ${SMTP_USER}
smtp_password = ${SMTP_PASSWORD}

# -----------------------------------------------------------------------------
# Security Configuration
# -----------------------------------------------------------------------------

# Prevent database manager access from web UI (security)
# Set to True only if you need web-based db management (not recommended)
db_manager = False

# Secure cookies (requires HTTPS)
secure_cookie = True

# -----------------------------------------------------------------------------
# Performance & Caching
# -----------------------------------------------------------------------------

# Enable asset caching
enable_asset_debug = False

# Unaccent for better search performance
unaccent = True

# -----------------------------------------------------------------------------
# Localization
# -----------------------------------------------------------------------------

# Default language (can be overridden per user)
# Supported: en_US, am_ET
# load_language = en_US,am_ET

# Timezone
# CRITICAL: Must match server timezone for correct date/time handling
# Use environment variable TZ=Africa/Addis_Ababa

# -----------------------------------------------------------------------------
# Developer Mode (NEVER ENABLE IN PRODUCTION)
# -----------------------------------------------------------------------------

# Developer mode features
# SECURITY WARNING: Exposes internal system information
# dev_mode = 

# Test mode (NEVER enable in production)
# test_enable = False

# -----------------------------------------------------------------------------
# Reports Configuration
# -----------------------------------------------------------------------------

# Report directory for custom reports
# reportgz = False

# -----------------------------------------------------------------------------
# CSV Import/Export
# -----------------------------------------------------------------------------

# CSV separator character
csv_internal_sep = ,

# -----------------------------------------------------------------------------
# Translation Configuration
# -----------------------------------------------------------------------------

# Translation export format
# translate_modules = ['all']

# Override translation terms
# translate_out = 

# Import translation file
# translate_in = 

# -----------------------------------------------------------------------------
# Geolocation (Optional)
# -----------------------------------------------------------------------------

# GeoIP database path (for location-based features)
# geoip_database = /usr/share/GeoIP/GeoLite2-City.mmdb

# -----------------------------------------------------------------------------
# WebSocket (Real-time features)
# -----------------------------------------------------------------------------

# WebSocket timeout (seconds)
websocket_keep_alive_timeout = 3600
websocket_rate_limit_burst = 10
websocket_rate_limit_delay = 0.2

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
#
# Configuration precedence (highest to lowest):
# 1. Command-line arguments
# 2. Environment variables
# 3. This configuration file
# 4. Odoo defaults
#
# Environment variable substitution:
#   ${VAR_NAME} is replaced with environment variable value
#   ${VAR_NAME:-default} uses default if VAR_NAME not set
#
# Verify configuration:
#   odoo -c /etc/odoo/odoo.conf --test-enable --stop-after-init
#
# =============================================================================
