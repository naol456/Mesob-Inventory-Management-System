# =============================================================================
# Mesob Inventory - LOCAL TESTING Docker Compose
# =============================================================================
#
# Simplified configuration for local Windows testing
# Uses only Odoo and PostgreSQL (no Nginx, no SSL)
#
# Usage:
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#
# =============================================================================

version: '3.8'

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: mesob-postgres-local
    restart: ${RESTART_POLICY:-unless-stopped}
    
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=${TZ:-Africa/Addis_Ababa}
    
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    
    networks:
      - mesob_network_local
    
    ports:
      - "5432:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=8MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB

  # ---------------------------------------------------------------------------
  # Odoo Application Server
  # ---------------------------------------------------------------------------
  odoo:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: mesob-inventory-local:${ODOO_VERSION:-19.0}
    container_name: mesob-odoo-local
    restart: ${RESTART_POLICY:-unless-stopped}
    
    depends_on:
      postgres:
        condition: service_healthy
    
    environment:
      - HOST=${POSTGRES_HOST:-postgres}
      - PORT=${POSTGRES_PORT:-5432}
      - USER=${POSTGRES_ODOO_USER:-odoo}
      - PASSWORD=${POSTGRES_ODOO_PASSWORD:?POSTGRES_ODOO_PASSWORD must be set}
      - TZ=${TZ:-Africa/Addis_Ababa}
    
    volumes:
      # Configuration (using local simplified config)
      - ./config/odoo.local.conf:/etc/odoo/odoo.conf:ro
      
      # Data persistence
      - odoo_data_local:/var/lib/odoo
      - odoo_logs_local:/var/log/odoo
      
      # Custom addons (mounted from parent directory)
      - ../addons:/mnt/extra-addons:ro
    
    networks:
      - mesob_network_local
    
    ports:
      # Expose directly on host for easy access
      - "8069:8069"
      - "8072:8072"
    
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    
    labels:
      - "com.mesob.service=odoo"
      - "com.mesob.version=${ODOO_VERSION:-19.0}"
      - "com.mesob.environment=local_testing"

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  mesob_network_local:
    driver: bridge
    name: mesob_network_local

# =============================================================================
# VOLUMES (Named volumes for easy cleanup)
# =============================================================================

volumes:
  
  # PostgreSQL data
  postgres_data_local:
    name: mesob_postgres_data_local
  
  # Odoo filestore
  odoo_data_local:
    name: mesob_odoo_data_local
  
  # Odoo logs
  odoo_logs_local:
    name: mesob_odoo_logs_local

# =============================================================================
# NOTES FOR LOCAL TESTING
# =============================================================================
#
# Start services:
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d
#
# View logs:
#   docker compose -f docker-compose.local.yml logs -f
#
# Stop services:
#   docker compose -f docker-compose.local.yml down
#
# Clean up everything (including volumes):
#   docker compose -f docker-compose.local.yml down -v
#
# Access Odoo:
#   http://localhost:8069
#
# Differences from production:
#   - No Nginx reverse proxy (direct access)
#   - No SSL/TLS
#   - Ports exposed on host
#   - Named volumes for easy cleanup
#   - No certbot
#
# =============================================================================
